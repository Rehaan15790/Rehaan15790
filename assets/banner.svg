<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Rehaan Taherbhoy</title>
  <desc id="desc">B.Tech AI and Data Science. Local-first AI, voice, LLM tooling and the security around them.</desc>
  <style>
    .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <pattern id="stripes" width="36" height="48" patternUnits="userSpaceOnUse" patternTransform="skewX(-45)">
      <rect width="18" height="48" fill="#ff1e2d"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="#050505"/>
  <rect width="1280" height="352" fill="url(#grid)"/>
  <polygon points="960,0 1120,0 920,352 760,352" fill="#ff1e2d" fill-opacity="0.08"/>
  <polygon points="1150,0 1190,0 990,352 950,352" fill="#ff1e2d" fill-opacity="0.05"/>

  <rect x="96" y="92" width="160" height="160" rx="18" fill="#0c0c0c" stroke="#ff1e2d" stroke-width="3"/>
  <rect x="96" y="92" width="160" height="160" rx="18" fill="none" stroke="#ff1e2d" stroke-width="3" filter="url(#glow)" stroke-opacity="0.6"/>
  <path d="M130 140l36 32-36 32" fill="none" stroke="#ff1e2d" stroke-width="14" stroke-linecap="square"/>
  <rect class="cursor" x="180" y="196" width="46" height="12" fill="#f4f4f4"/>

  <g class="sans" font-size="68" font-weight="900">
    <text x="300" y="186" textLength="840" lengthAdjust="spacing"><tspan fill="#f4f4f4">REHAAN</tspan><tspan fill="#ff1e2d"> TAHERBHOY</tspan></text>
  </g>
  <text x="304" y="232" class="sans" font-size="17" font-weight="600" fill="#8c8c8c" textLength="720" lengthAdjust="spacing">B.TECH AI &amp; DATA SCIENCE · LOCAL-FIRST AI · AI SECURITY</text>

  <text x="304" y="294" class="mono" font-size="20" textLength="96" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff1e2d">$</tspan><tspan fill="#f4f4f4"> whoami</tspan></text>
  <rect class="cursor" x="406" y="277" width="11" height="21" fill="#ff1e2d"/>

  <rect y="352" width="1280" height="48" fill="#050505"/>
  <rect y="352" width="1280" height="48" fill="url(#stripes)"/>
  <rect x="96" y="362" width="548" height="28" fill="#050505"/>
  <text x="112" y="382" class="sans" font-size="14" font-weight="700" fill="#ff1e2d" textLength="516" lengthAdjust="spacing">BELPHEGOR / ULTRON / OCEANLENS 3D / PRODUCTIVITY</text>
</svg>
