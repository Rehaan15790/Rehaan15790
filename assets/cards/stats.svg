<svg xmlns="http://www.w3.org/2000/svg" width="860" height="252" viewBox="0 0 860 252" role="img" aria-label="GitHub Stats">
<title>GitHub Stats</title>
<style>
text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
.mono { font-family: ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace; }
.orb-a { animation: fa 9s ease-in-out infinite; }
.orb-b { animation: fb 11s ease-in-out infinite 1.1s; }
.orb-c { animation: fc 13s ease-in-out infinite .6s; }
.in { animation: in .6s ease-out both; }
.grow { animation: grow 1.1s ease-out both; transform-box: fill-box; transform-origin: left; }
@keyframes fa { 50% { transform: translate(28px,-18px); opacity: .9; } }
@keyframes fb { 50% { transform: translate(-24px,16px); opacity: .75; } }
@keyframes fc { 50% { transform: translate(18px,-10px); opacity: .6; } }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
@keyframes grow { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#000"/><stop offset="54%" stop-color="#280000"/><stop offset="100%" stop-color="#000"/></linearGradient>
<linearGradient id="fire" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff4500"/><stop offset="60%" stop-color="#ff8c00"/><stop offset="100%" stop-color="#ffd166"/></linearGradient>
<radialGradient id="o0"><stop offset="0%" stop-color="#ff4500" stop-opacity="0.72"/><stop offset="58%" stop-color="#ff4500" stop-opacity=".18"/><stop offset="100%" stop-color="#ff4500" stop-opacity="0"/></radialGradient><radialGradient id="o1"><stop offset="0%" stop-color="#ff8c00" stop-opacity="0.5"/><stop offset="58%" stop-color="#ff8c00" stop-opacity=".18"/><stop offset="100%" stop-color="#ff8c00" stop-opacity="0"/></radialGradient><radialGradient id="o2"><stop offset="0%" stop-color="#ffd166" stop-opacity="0.6"/><stop offset="58%" stop-color="#ffd166" stop-opacity=".18"/><stop offset="100%" stop-color="#ffd166" stop-opacity="0"/></radialGradient><radialGradient id="o3"><stop offset="0%" stop-color="#cc0000" stop-opacity="0.72"/><stop offset="58%" stop-color="#cc0000" stop-opacity=".18"/><stop offset="100%" stop-color="#cc0000" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect width="860" height="252" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="860" height="252" fill="url(#bg)"/>
<ellipse class="orb-a" cx="140" cy="40" rx="220" ry="110" fill="url(#o0)" opacity=".6"/>
<ellipse class="orb-b" cx="660" cy="50" rx="240" ry="100" fill="url(#o1)" opacity=".45"/>
<ellipse class="orb-c" cx="480" cy="252" rx="320" ry="80" fill="url(#o2)" opacity=".35"/>
<ellipse class="orb-b" cx="840" cy="202" rx="180" ry="100" fill="url(#o3)" opacity=".45"/>
<rect x="26" y="26" width="808" height="200" rx="20" fill="#08080c" fill-opacity=".5" stroke="#ff4500" stroke-opacity=".55"/>
<text x="46" y="64" font-size="28" font-weight="800" fill="url(#fire)">GitHub Stats</text>
<text x="48" y="88" font-size="13" font-weight="600" letter-spacing="1.2" fill="#ff8c61">@rehaan15790 · public activity, refreshed daily</text>
<g class="in" style="animation-delay:0ms"><rect x="46" y="108" width="180" height="100" rx="14" fill="#fff" fill-opacity=".04" stroke="#ff4500" stroke-opacity=".45"/><rect x="64" y="108" width="40" height="3" rx="1.5" fill="#ff4500"/><text x="64" y="136" font-size="11" font-weight="800" letter-spacing="1.6" fill="#ff8c61">CONTRIBUTIONS</text><text x="64" y="178" font-size="36" font-weight="900" fill="#ff4500">227</text><text x="64" y="196" font-size="11" fill="#ff8c61" fill-opacity=".75">last 12 months</text></g><g class="in" style="animation-delay:90ms"><rect x="242" y="108" width="180" height="100" rx="14" fill="#fff" fill-opacity=".04" stroke="#ff4500" stroke-opacity=".45"/><rect x="260" y="108" width="40" height="3" rx="1.5" fill="#ff8c00"/><text x="260" y="136" font-size="11" font-weight="800" letter-spacing="1.6" fill="#ff8c61">CURRENT STREAK</text><text x="260" y="178" font-size="36" font-weight="900" fill="#ff8c00">1</text><text x="260" y="196" font-size="11" fill="#ff8c61" fill-opacity=".75">best: 5 days</text></g><g class="in" style="animation-delay:180ms"><rect x="438" y="108" width="180" height="100" rx="14" fill="#fff" fill-opacity=".04" stroke="#ff4500" stroke-opacity=".45"/><rect x="456" y="108" width="40" height="3" rx="1.5" fill="#ffd166"/><text x="456" y="136" font-size="11" font-weight="800" letter-spacing="1.6" fill="#ff8c61">STARS</text><text x="456" y="178" font-size="36" font-weight="900" fill="#ffd166">14</text><text x="456" y="196" font-size="11" fill="#ff8c61" fill-opacity=".75">across my repos</text></g><g class="in" style="animation-delay:270ms"><rect x="634" y="108" width="180" height="100" rx="14" fill="#fff" fill-opacity=".04" stroke="#ff4500" stroke-opacity=".45"/><rect x="652" y="108" width="40" height="3" rx="1.5" fill="#ff6b35"/><text x="652" y="136" font-size="11" font-weight="800" letter-spacing="1.6" fill="#ff8c61">REPOS</text><text x="652" y="178" font-size="36" font-weight="900" fill="#ff6b35">5</text><text x="652" y="196" font-size="11" fill="#ff8c61" fill-opacity=".75">public, not forks</text></g>
</g>
<rect x=".5" y=".5" width="859" height="251" rx="19.5" fill="none" stroke="#ff4500" stroke-opacity=".62"/>
</svg>
